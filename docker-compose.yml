name: superdocs

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: doctask_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doctask_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/core/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doctask_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
